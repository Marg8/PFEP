; Local dev config for PHP's built-in server (php -S).
; Apache/XAMPP uses .htaccess / php.ini instead; this file is for `php -S -c php.ini`.
file_uploads = On
upload_max_filesize = 0
post_max_size = 0
max_file_uploads = 20
max_execution_time = 300
max_input_time = 300
memory_limit = 512M
display_errors = On
