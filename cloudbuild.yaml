steps:
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - build
      - -t
      - '$_REGION-docker.pkg.dev/$PROJECT_ID/$_REPO/$_SERVICE:$COMMIT_SHA'
      - -t
      - '$_REGION-docker.pkg.dev/$PROJECT_ID/$_REPO/$_SERVICE:latest'
      - .

  - name: 'gcr.io/cloud-builders/docker'
    args:
      - push
      - --all-tags
      - '$_REGION-docker.pkg.dev/$PROJECT_ID/$_REPO/$_SERVICE'

  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - run
      - deploy
      - '$_SERVICE'
      - --image=$_REGION-docker.pkg.dev/$PROJECT_ID/$_REPO/$_SERVICE:$COMMIT_SHA
      - --region=$_REGION
      - --platform=managed
      - --allow-unauthenticated
      - --port=8080
      # VPC Connector para acceder a red interna (mtapp05)
      - --vpc-connector=$_VPC_CONNECTOR
      - --vpc-egress=private-ranges-only
      # DB en red interna
      - --set-env-vars=DB_HOST=$_DB_HOST,DB_PORT=3306,DB_NAME=materials,DB_USER=mrodriguez
      - --set-secrets=DB_PASS=pfep-db-pass:latest

substitutions:
  _REGION: us-central1
  _REPO: pfep
  _SERVICE: pfep-app
  _VPC_CONNECTOR: pfep-connector       # nombre del conector creado por setup-gcp.sh
  _DB_HOST: 10.X.X.X                   # IP interna de mtapp05 — cambiar antes de deploy

images:
  - '$_REGION-docker.pkg.dev/$PROJECT_ID/$_REPO/$_SERVICE:$COMMIT_SHA'
  - '$_REGION-docker.pkg.dev/$PROJECT_ID/$_REPO/$_SERVICE:latest'
