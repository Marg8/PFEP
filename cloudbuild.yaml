steps:
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - build
      - -t
      - '$_REGION-docker.pkg.dev/$PROJECT_ID/$_REPO/$_SERVICE:$COMMIT_SHA'
      - -t
      - '$_REGION-docker.pkg.dev/$PROJECT_ID/$_REPO/$_SERVICE:latest'
      - .

  - name: 'gcr.io/cloud-builders/docker'
    args:
      - push
      - --all-tags
      - '$_REGION-docker.pkg.dev/$PROJECT_ID/$_REPO/$_SERVICE'

  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - run
      - deploy
      - '$_SERVICE'
      - --image=$_REGION-docker.pkg.dev/$PROJECT_ID/$_REPO/$_SERVICE:$COMMIT_SHA
      - --region=$_REGION
      - --platform=managed
      - --allow-unauthenticated
      - --port=8080
      - --set-env-vars=DB_NAME=$_DB_NAME
      - --set-secrets=DB_USER=pfep-db-user:latest,DB_PASS=pfep-db-pass:latest
      - --add-cloudsql-instances=$_CLOUDSQL_INSTANCE
      - --set-env-vars=DB_SOCKET=/cloudsql/$_CLOUDSQL_INSTANCE

substitutions:
  _REGION: us-central1
  _REPO: pfep
  _SERVICE: pfep-app
  _DB_NAME: pfep
  _CLOUDSQL_INSTANCE: YOUR_PROJECT:us-central1:pfep-db

images:
  - '$_REGION-docker.pkg.dev/$PROJECT_ID/$_REPO/$_SERVICE:$COMMIT_SHA'
  - '$_REGION-docker.pkg.dev/$PROJECT_ID/$_REPO/$_SERVICE:latest'
